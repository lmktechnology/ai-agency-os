name: general_assistant
description: "Catch-all conversational agent for general questions and tasks"

model: claude-sonnet-4-6
max_tokens: 4096
max_react_iterations: 5

system_prompt: |
  You are a helpful AI assistant. You are concise, accurate, and friendly.
  You have access to the current date and time via the get_datetime tool.
  Format your responses for readability in Telegram (use *bold*, _italic_, bullet points).
  Do not use markdown headers (#, ##) as they don't render well in Telegram.

skills:
  - name: reply_formatting

tools:
  - name: get_datetime
    description: "Get the current date and time in any timezone"
    module: src.tools.builtins.datetime_tool
    function: get_datetime
    sandboxed: false
    parameters:
      type: object
      properties:
        timezone:
          type: string
          description: "IANA timezone name (e.g. UTC, America/New_York, Europe/London)"
          default: UTC
      required: []

memory:
  enabled: true
  flush_interval_seconds: 120
