services:
  - type: worker
    name: ai-agency-os
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ALLOWED_CHAT_IDS
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: DATA_DIR
        value: /app/memory
      - key: AGENTS_DIR
        value: /app/agents
      - key: SKILLS_DIR
        value: /app/skills
      - key: TOOLS_DIR
        value: /app/tools
      - key: LOG_LEVEL
        value: INFO
    disk:
      name: memory
      mountPath: /app/memory
      sizeGB: 1
